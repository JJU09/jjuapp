  <style>
    :root {
      --violet: #7c3aed; --blue: #2563eb; --ink900: #0f0f1a; --ink500: #6b6b8e;
      --ink300: #a0a0c0; --border: #e6e6f2; --surface: #f8f8fc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Pretendard', 'Space Grotesk', system-ui, sans-serif;
      color: var(--ink900); background: #fff; line-height: 1.6;
      -webkit-font-smoothing: antialiased; word-break: keep-all;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .grid {
      position: fixed; inset: 0; z-index: -1; opacity: .5;
      background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 44px 44px;
    }
    .glow {
      position: fixed; top: -20%; left: 50%; transform: translateX(-50%); z-index: -1;
      width: 720px; height: 520px; filter: blur(20px);
      background: radial-gradient(closest-side, rgba(124,58,237,.16), rgba(37,99,235,.08), transparent);
    }
    main { width: 100%; max-width: 640px; padding: 48px 24px; }
    .hero { margin-bottom: 36px; }
    h1 {
      font-family: 'Space Grotesk', 'Pretendard', sans-serif; font-weight: 700;
      font-size: clamp(34px, 8vw, 52px); letter-spacing: -.03em; line-height: 1.1;
    }
    h1 .handle {
      font-size: .42em; font-family: ui-monospace, monospace; color: var(--ink300);
      font-weight: 500; margin-left: 10px; letter-spacing: 0;
    }
    .tagline { margin-top: 14px; font-size: clamp(16px, 4vw, 20px); color: var(--ink500); }
    .tagline b { color: var(--ink900); font-weight: 700; }
    .grad { background: linear-gradient(115deg, var(--violet), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }

    .card {
      display: block; text-decoration: none; color: inherit; position: relative;
      padding: 26px; border: 1px solid var(--border); border-radius: 20px; background: #fff;
      transition: border-color .15s, box-shadow .2s, transform .2s;
    }
    .card:hover { border-color: var(--violet); box-shadow: 0 16px 40px rgba(124,58,237,.12); transform: translateY(-2px); }
    .badge {
      display: inline-block; font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .08em; color: var(--violet);
      background: rgba(124,58,237,.1); padding: 4px 10px; border-radius: 999px; margin-bottom: 14px;
    }
    .card h2 { font-family: 'Space Grotesk', 'Pretendard', sans-serif; font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .card p { color: var(--ink500); font-size: 15px; }
    .go { display: inline-block; margin-top: 16px; font-weight: 600; color: var(--violet); font-family: ui-monospace, monospace; font-size: 14px; }

    footer { margin-top: 36px; display: flex; gap: 20px; align-items: center; }
    footer a {
      color: var(--ink500); text-decoration: none; font-size: 14px; font-weight: 500;
      display: inline-flex; align-items: center; min-height: 40px;
    }
    footer a:hover { color: var(--violet); }
    footer .sep { color: var(--border); }
